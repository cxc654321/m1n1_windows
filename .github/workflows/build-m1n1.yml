name: build-m1n1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-m1n1.yml'
      - 'src/**'
      - 'proxyclient/**'
      - 'rust/**'
      - 'Makefile'
      - 'config.h'
      - '*.ld'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential python3 python3-pip device-tree-compiler git

      - name: 安装 Rust target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-unknown-none-softfloat
          rustc --version

      - name: 构建 m1n1
        run: |
          source "$HOME/.cargo/env"
          make -j$(nproc) EXTRA_CFLAGS="-DNATIVE_UEFI"
          aarch64-linux-gnu-objdump -d build/kboot.o > build/kboot-disassembly.txt
          ls -lh build/m1n1.bin build/m1n1.macho

      - name: 校验 Python 语法
        run: python3 -m compileall -q proxyclient

      - name: 打包构建基线（非脱机启动镜像）
        run: |
          mkdir -p dist
          cp build/m1n1.bin build/m1n1.macho dist/
          cp -r proxyclient dist/
          cp requirements.txt build/kboot-disassembly.txt dist/
          git rev-parse HEAD > dist/COMMIT.txt
          sha256sum dist/m1n1.bin dist/m1n1.macho > dist/SHA256SUMS
          cat > dist/README.txt <<'TXT'
          Experimental NATIVE_UEFI build: bypass HV-only ADT alias mappings.
          Both ADT property writes use the original physically backed tree.
          Built with EXTRA_CFLAGS=-DNATIVE_UEFI; not hardware validated.
          This artifact is NOT a standalone Windows/UEFI boot solution.
          Hypervisor startup currently depends on an external USB proxy host.
          No UEFI firmware or Windows image is included.
          Direct FD loading and hardware compatibility have not been validated.
          Do not overwrite your macOS boot volume or ESP with this artifact.
          Offline hypervisor startup remains development work.
          TXT

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: m1n1-native-uefi-experimental
          path: dist/
          retention-days: 30
